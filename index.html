<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GolpoTune - Your favourite audio station</title>
  <meta name="description" content="GolpoTune - your favourite audio station for stories.">
  <meta name="theme-color" content="#08071a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar" id="topbar"></header>
  <main id="app" tabindex="-1"></main>
  <footer class="footer">
    <span class="logo"><span class="g">Golpo</span><span class="t">Tune</span></span><br>Your favourite audio station
  </footer>
  <nav class="bottomnav" id="bottomnav" aria-label="Main"></nav>

  <!-- the one audio element: it keeps playing while you browse -->
  <audio id="audio" preload="none"></audio>
  <div class="miniplayer" id="miniplayer" hidden></div>
  <section class="fullplayer" id="fullplayer" role="dialog" aria-modal="true" aria-label="Audio player" hidden></section>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
